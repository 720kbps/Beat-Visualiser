[package]
name = "beat-visualiser"
version = "0.1.0"
description = "Turns a beat into a 9:16 video with a recorded plugin window"
authors = ["Bogdan Mocanu"]
license = ""
repository = "https://github.com/720kbps/Beat-Visualiser"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "beat_visualiser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset: lets the webview load recordings by file path through the
# `asset://` protocol (convertFileSrc in JS). Must match
# app.security.assetProtocol.enable in tauri.conf.json; tauri-build checks that.
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# MIDI out to FL Studio. In normal deps because midir builds on macOS and
# Windows (CoreMIDI / WinMM); only its virtual-port feature is macOS-only,
# and that part is gated with #[cfg] in fl_midi.rs.
midir = "0.11.1"
tauri-plugin-dialog = "2"

# macOS only: ScreenCaptureKit (list and later capture windows) and
# CoreGraphics (check the Screen Recording permission). The macos_15_0
# feature enables SCRecordingOutput, which writes the video file for us.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_15_0"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
