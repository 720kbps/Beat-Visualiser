<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Beat Visualiser architecture: FL Studio, Rust and the webview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Card background (keeps it readable in dark mode too) -->
  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/>

  <text x="20" y="34" font-size="18" font-weight="700" fill="#111827">How the pieces talk</text>

  <!-- FL Studio -->
  <rect x="20" y="60" width="220" height="250" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="36" y="90" font-size="16" font-weight="700" fill="#9a3412">FL Studio</text>
  <text x="36" y="110" font-size="12" fill="#6b7280">fl-script/ · Python inside FL</text>
  <text x="36" y="150" font-size="13" fill="#1f2937">• play / stop / rewind</text>
  <text x="36" y="174" font-size="13" fill="#1f2937">• switches to song mode</text>
  <text x="36" y="198" font-size="13" fill="#1f2937">• shows the plugin windows</text>
  <text x="48" y="218" font-size="12" fill="#6b7280">(must be Detached)</text>

  <!-- Rust -->
  <rect x="400" y="60" width="240" height="250" rx="12" fill="#fafaf9" stroke="#b45309" stroke-width="2"/>
  <text x="416" y="90" font-size="16" font-weight="700" fill="#92400e">Rust (native side)</text>
  <text x="416" y="110" font-size="12" fill="#6b7280">src-tauri/src/</text>
  <text x="416" y="150" font-size="13" fill="#1f2937">• record windows + audio</text>
  <text x="428" y="170" font-size="12" fill="#6b7280">ScreenCaptureKit → .mov</text>
  <text x="416" y="196" font-size="13" fill="#1f2937">• send MIDI to FL (midir)</text>
  <text x="416" y="222" font-size="13" fill="#1f2937">• read / write files</text>
  <text x="416" y="290" font-size="11" fill="#6b7280">take.rs · recorder.rs · fl_midi.rs</text>

  <!-- Webview -->
  <rect x="780" y="60" width="200" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="796" y="90" font-size="16" font-weight="700" fill="#1e40af">Webview</text>
  <text x="796" y="110" font-size="12" fill="#6b7280">src/ · WKWebView</text>

  <rect x="795" y="122" width="170" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="807" y="145" font-size="13" font-weight="700" fill="#1e3a8a">ui/ — Svelte</text>
  <text x="807" y="166" font-size="11" fill="#4b5563">buttons, lists, App.svelte</text>

  <line x1="880" y1="180" x2="880" y2="204" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="888" y="197" font-size="11" fill="#6b7280">calls</text>

  <rect x="795" y="206" width="170" height="92" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="807" y="228" font-size="13" font-weight="700" fill="#1e3a8a">engine/ — plain TS</text>
  <text x="807" y="248" font-size="11" fill="#4b5563">audio · frame · sync</text>
  <text x="807" y="266" font-size="11" fill="#4b5563">render (Three.js themes)</text>
  <text x="807" y="284" font-size="11" fill="#4b5563">export (WebCodecs)</text>

  <!-- Rust -> FL: MIDI -->
  <line x1="400" y1="130" x2="242" y2="130" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="120" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">MIDI notes</text>
  <text x="320" y="148" font-size="11" fill="#6b7280" text-anchor="middle">port “Beat Visualiser”</text>

  <!-- FL -> Rust: captured video + audio -->
  <line x1="240" y1="240" x2="398" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="230" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">window video</text>
  <text x="320" y="258" font-size="11" fill="#6b7280" text-anchor="middle">+ FL's audio</text>

  <!-- Webview -> Rust: invoke -->
  <line x1="780" y1="140" x2="642" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="130" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">invoke()</text>

  <!-- Rust -> Webview: results -->
  <line x1="640" y1="200" x2="778" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="190" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">results</text>
  <text x="710" y="218" font-size="11" fill="#6b7280" text-anchor="middle">paths, offsets, bytes</text>

  <!-- Disk -->
  <rect x="400" y="350" width="240" height="70" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="416" y="378" font-size="13" font-weight="700" fill="#374151">~/Movies/Beat Visualiser/</text>
  <text x="416" y="402" font-size="12" fill="#6b7280">take-*.mov · export-*.mp4</text>

  <!-- Rust <-> Disk -->
  <line x1="520" y1="312" x2="520" y2="348" stroke="#4b5563" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="530" y="335" font-size="11" fill="#6b7280">writes / reads</text>

  <!-- Disk -> engine: asset protocol -->
  <path d="M640,385 H880 V312" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="377" font-size="11" fill="#6b7280">asset:// — clips for preview &amp; export</text>

  <text x="20" y="452" font-size="12" fill="#6b7280">Frames are computed from time, so the preview and the export render the same pixels.</text>
</svg>
